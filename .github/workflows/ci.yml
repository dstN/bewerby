name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches package.json's engines field (enforced by .npmrc's
      # engine-strict) - NOT the production server's Node version. pdfjs-dist
      # requires Node >=22.13 to *install*, but the built output that
      # actually runs on the server (see DEPLOYMENT.md) is a fully bundled,
      # dependency-free artifact; the server itself only needs Node >=20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e
