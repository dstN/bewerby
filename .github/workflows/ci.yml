name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Generous, but bounded: a transient runner-infra hang (e.g. apt-get
    # stalling against a mirror) should fail loudly within minutes, not burn
    # Actions minutes for hours with no visibility until manually cancelled.
    # 20 (not 15): the Playwright install step below now retries internally,
    # each attempt individually bounded, and needs headroom for that.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Matches package.json's engines field (enforced by .npmrc's
      # engine-strict) and current local dev - NOT the production server's
      # Node version. pdfjs-dist only requires Node >=22.13 to *install*, but
      # the built output that actually runs on the server (see DEPLOYMENT.md)
      # is a fully bundled, dependency-free artifact; the server itself only
      # needs Node >=20.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # apt-get against the runner's mirror has twice now stalled for 15-30
      # minutes instead of failing cleanly (observed on real runs, not
      # hypothetical) - each attempt gets its own hard 4-minute cap via
      # `timeout` so a hung apt-get is killed and retried instead of eating
      # the whole job budget.
      - name: Install Playwright browser
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Attempt $attempt failed or timed out, retrying..."
          done
          exit 1

      - name: E2E smoke tests
        run: npm run test:e2e
