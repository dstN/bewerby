name: CI

# Not on master: a commit gets there by fast-forward after its branch passed,
# and deploy.yml ships that branch run's build instead of testing the same
# commit again. For a commit that never ran here (a merge commit, a direct
# push), deploy.yml calls this workflow itself.
on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Generous, but bounded: a transient runner-infra hang (e.g. apt-get
    # stalling against a mirror) should fail loudly within minutes, not burn
    # Actions minutes for hours with no visibility until manually cancelled.
    # This is intentionally the ONLY layer that kills a hung apt-get - see
    # the comment on the Playwright install step for why an in-job retry
    # loop with its own `timeout` actively made this worse, not better.
    timeout-minutes: 15
    # Public OAuth client ids of the sync providers (#53). Not secrets - PKCE
    # needs none - so repository variables, not secrets. Job-wide, so the
    # artifact build and the build the E2E run makes come out the same. An
    # unset variable builds without that provider (see vite.config.ts).
    env:
      PUBLIC_DROPBOX_APP_KEY: ${{ vars.PUBLIC_DROPBOX_APP_KEY }}
      PUBLIC_MS_CLIENT_ID: ${{ vars.PUBLIC_MS_CLIENT_ID }}
      PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
      PUBLIC_STUN_URL: ${{ vars.PUBLIC_STUN_URL }}
    steps:
      - uses: actions/checkout@v7

      # Matches package.json's engines field (enforced by .npmrc's
      # engine-strict), local dev, and the production server (Node 26 on
      # Netcup). The built output that runs there is a fully bundled,
      # dependency-free artifact (see DEPLOYMENT.md), so strictly it only
      # needs SvelteKit 3's minimum, Node >=22.17.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # apt-get against the runner's mirror has intermittently stalled for
      # 15-30 minutes instead of failing cleanly (observed on real runs).
      # A retry loop with its own `timeout` wrapper was tried here and made
      # things worse: `timeout` only signals its direct child (npx), not the
      # privileged `sudo apt-get` it spawns, which sudo does not forward
      # signals to by default - so a killed attempt leaves apt-get running,
      # holding the dpkg lock, and every subsequent retry in the *same* job
      # fails instantly instead of ever getting a clean shot. The job-level
      # timeout-minutes above is the only safety net that actually works
      # here, since it tears down the whole runner VM rather than one
      # subprocess - on a hang, re-running the job gets a clean machine.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

      # This artifact IS the release - deploy.yml downloads exactly this
      # build and ships it, rather than re-running `npm run build` in the
      # deploy job, so what gets deployed is provably what CI tested. Every
      # branch uploads it, because the run that tested a commit is the one
      # whose build ships when master fast-forwards to it. Not for pull
      # requests: those build a merge ref that never reaches master as is.
      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bewerby-build-${{ github.sha }}
          path: build/
          retention-days: 7
