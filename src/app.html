<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: dark)" />
		<meta
			name="description"
			content="bewerby - DSGVO-konformer Bewerbungsmanager. Verwalte deine Bewerbungen lokal und sicher im Browser."
		/>

		<!-- Link-preview cards (WhatsApp, Discord, Slack, Twitter/X, ...). This
		     shell is shared by every prerendered route with no per-page values
		     to fill in (app.html sits outside the Svelte component tree, before
		     i18n initializes - same reason the description above is hardcoded
		     German rather than translated), so these describe the app as a
		     whole rather than the specific page being shared. og:image must be
		     an absolute URL per the OG spec; the domain is hardcoded since this
		     file is bewerby.de-specific, not portable template code. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="bewerby" />
		<meta property="og:title" content="bewerby – DSGVO-konformer Bewerbungsmanager" />
		<meta
			property="og:description"
			content="Verwalte deine Bewerbungen lokal und sicher im Browser. Keine Konten, keine Server, keine Cloud."
		/>
		<meta property="og:url" content="https://bewerby.de/" />
		<meta property="og:image" content="https://bewerby.de/screenshots/board-wide.png" />
		<meta property="og:image:width" content="1280" />
		<meta property="og:image:height" content="800" />
		<meta property="og:locale" content="de_DE" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="bewerby – DSGVO-konformer Bewerbungsmanager" />
		<meta
			name="twitter:description"
			content="Verwalte deine Bewerbungen lokal und sicher im Browser. Keine Konten, keine Server, keine Cloud."
		/>
		<meta name="twitter:image" content="https://bewerby.de/screenshots/board-wide.png" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="bewerby" />
		<link rel="icon" type="image/png" href="/icons/apple-touch-icon.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.json" />

		<!-- Preload the 4 actually-used Lexend weights (see issue #22) so they
		     start fetching immediately instead of waiting on style/layout to
		     discover the @font-face rules in app.css. -->
		<link
			rel="preload"
			href="/fonts/lexend-regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/lexend-500.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/lexend-600.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/lexend-700.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>

		<!-- Prevent FOUC on theme (apply .dark before first paint) and set the
		     skip-link's language before it can be perceived. Both live in this
		     one script, in <head>, matching the only pattern SvelteKit's CSP
		     hash auto-detection reliably picks up for a prerendered page - a
		     second inline <script> placed in <body> (tried first) was silently
		     dropped from the generated script-src hash list and blocked at
		     runtime. The skip-link update is deferred to DOMContentLoaded since
		     the element itself doesn't exist yet while this script (in <head>)
		     runs; app.html can't call t() directly since it's the static shell
		     SvelteKit injects the built app into, outside the Svelte component
		     tree - mirrors the locale detection in $lib/i18n/index.svelte.ts. -->
		<script>
			(function () {
				const stored = localStorage.getItem('bewerby-theme');
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (stored === 'dark' || (!stored && prefersDark)) {
					document.documentElement.classList.add('dark');
				}

				const skipLinkLabels = { de: 'Zum Inhalt springen', en: 'Skip to content' };
				const storedLocale = localStorage.getItem('bewerby-locale');
				const browserLocale = (navigator.language || '').slice(0, 2).toLowerCase();
				const locale = skipLinkLabels[storedLocale]
					? storedLocale
					: skipLinkLabels[browserLocale]
						? browserLocale
						: 'de';
				document.addEventListener('DOMContentLoaded', () => {
					const skipLink = document.getElementById('skip-link');
					if (skipLink) skipLink.textContent = skipLinkLabels[locale];
				});
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Skip to content link for keyboard/screen reader users. -->
		<a href="#main-content" class="skip-link" id="skip-link">Zum Inhalt springen</a>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
