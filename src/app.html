<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: dark)" />
		<meta
			name="description"
			content="bewerby - DSGVO-konformer Bewerbungsmanager. Verwalte deine Bewerbungen lokal und sicher im Browser."
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="bewerby" />
		<link rel="icon" type="image/png" href="/icons/apple-touch-icon.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.json" />

		<!-- Prevent FOUC on theme: apply .dark before first paint -->
		<script>
			(function () {
				const stored = localStorage.getItem('bewerby-theme');
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (stored === 'dark' || (!stored && prefersDark)) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Skip to content link for keyboard/screen reader users -->
		<a href="#main-content" class="skip-link"> Zum Inhalt springen </a>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
